<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: {{BG}};  --accent: {{ACCENT}};  --ink: #ffffff;
    /* safe zones: las inyecta render.py según el tamaño (NO tocar a mano) */
    --safe-top: 67px; --safe-bottom: 67px; --safe-x: 54px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;position:relative}
  body{background:var(--bg);color:var(--ink);font-family:'Oswald','Arial Narrow',system-ui,sans-serif}
  .bg{position:absolute;inset:0;background:var(--bg) center/cover no-repeat;
      background-image:url('{{PHOTO_BG}}')}
  .overlay{position:absolute;inset:0;background:rgba(246,243,236,.97)}
  .content{position:absolute;top:var(--safe-top);bottom:var(--safe-bottom);
     left:var(--safe-x);right:var(--safe-x);display:flex;flex-direction:column}
  /* LOGO — va la IMAGEN REAL, nunca el nombre recompuesto con tipografía (regla de Dirección). */
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{height:46px;width:auto;display:block}
  .brand img:not([src]),.brand img[src=""]{display:none}
  /* 9:16: texto arriba y foto a sangre abajo — el patrón medido de la casa. */
  body.size-story .content{bottom:auto;justify-content:flex-start}
  body.size-story .cta{margin-top:38px}
  body.size-story .overlay{background:linear-gradient(180deg,
      rgba(8,16,26,.88) 0%, rgba(8,16,26,.80) 46%, rgba(8,16,26,.30) 64%, rgba(8,16,26,.55) 100%)}
  /* 9:16 SIN foto: se reparte por toda la altura en vez de dejar el tercio inferior muerto. */
  body.size-story.sin-foto .content{bottom:var(--safe-bottom);justify-content:space-between}
  body.size-story.sin-foto .cta{margin-top:0}
  .guides{position:absolute;inset:0;pointer-events:none;display:none}
  .guides .z{position:absolute;left:0;right:0;background:rgba(255,0,80,.22);
             border-top:2px dashed #ff0050;border-bottom:2px dashed #ff0050}
  .guides .safe{position:absolute;top:var(--safe-top);bottom:var(--safe-bottom);
                left:var(--safe-x);right:var(--safe-x);border:2px dashed #00e5ff}
  body.show-guides .guides{display:block}

  /* ── Propio de este formato. Va AL FINAL: así sus reglas de 9:16 ganan a las genéricas. ── */
  /* Página editorial: fondo papel, el masthead SUSTITUYE al logo (regla dura del formato 1). */
  body{color:#14181f}
  .masthead{font-family:'Playfair Display',Georgia,serif;font-size:52px;text-align:center;
            letter-spacing:.02em;padding-bottom:14px;border-bottom:3px solid #14181f}
  .meta{display:flex;justify-content:space-between;font-size:24px;text-transform:uppercase;
        letter-spacing:.12em;padding:12px 0;border-bottom:1px solid #14181f;opacity:.75}
  .titular{font-family:'Playfair Display',Georgia,serif;font-size:86px;line-height:1.06;margin-top:30px}
  .titular em{font-style:italic;color:var(--accent)}
  .entradilla{font-family:'Playfair Display',Georgia,serif;font-size:33px;line-height:1.42;margin-top:22px}
  /* La foto es FIGURA DE ARTÍCULO, nunca a sangre: a sangre deja de parecer una nota de prensa. */
  .figura{margin-top:26px;height:430px;background:#d8d3c8 center/cover no-repeat;
          background-image:url('{{PHOTO}}')}
  .pie{margin-top:auto;padding-top:18px;border-top:3px solid #14181f;display:flex;
       justify-content:space-between;align-items:center}
  .descriptor{font-size:22px;text-transform:uppercase;letter-spacing:.14em;font-variant:small-caps}
  .cta{background:transparent;border:3px solid var(--accent);color:#14181f;border-radius:70px;
       font-weight:700;font-size:30px;padding:16px 34px;text-transform:uppercase}
  .firma .brand{display:inline-flex;vertical-align:middle}
  .firma{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:24px;
         margin-top:10px;text-align:right;opacity:.8}
  body.size-story .overlay{background:rgba(246,243,236,.97)}
  body.size-story .titular{font-size:104px}
  body.size-story .figura{height:620px}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="masthead">{{MEDIO}}</div>
    <div class="meta"><span>{{SECCION}}</span><span>{{FECHA}}</span></div>
    <div class="titular">{{TITULAR}}</div>
    <div class="entradilla">{{ENTRADILLA}}</div>
    <div class="figura"></div>
    <div class="pie">
      <span class="descriptor">{{DESCRIPTOR}}</span>
      <span class="cta">{{CTA}}</span>
    </div>
    <div class="firma">Por <span class="brand"><img src="{{LOGO_SRC}}" alt=""><span>{{BRAND}}</span></span></div>
  </div>
  <div class="guides"><div class="safe"></div>{{GUIDE_ZONES}}</div>
</body>
</html>
